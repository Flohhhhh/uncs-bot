name: Checks

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

jobs:
  workspace-services:
    name: Independent web, API and bot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install all workspaces from the root lockfile
        run: npm ci
      - name: Validate production imports and handler registrations
        run: |
          npm run validate:railway
          npm run validate:workspaces
          npm run validate:handlers
      - name: Build services independently
        run: npm run build:stack
      - name: Check workspace types and lint
        run: |
          npm run typecheck -- .railway/railway.ts scripts/validate-railway.ts apps/api/src/main.ts apps/bot/src/main.ts packages/contracts/src/index.ts packages/api-client/src/index.ts apps/web/src/app/health/ready/route.ts
          npm run lint -- .railway apps/api/src apps/api/tests apps/bot/src apps/bot/tests packages scripts
      - name: Verify HTTP contracts, security, delivery and browser workflows
        run: |
          npm run test:stack
          npm run test:unit --workspace @uncs/web

  storage-tests:
    name: PostgreSQL storage and concurrency
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: uncs_launch_test
          POSTGRES_USER: uncs_launch_test
          POSTGRES_PASSWORD: uncs_launch_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U uncs_launch_test -d uncs_launch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test production stores with simultaneous database connections
        run: npm run test:storage
        env:
          UNCS_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Verify compiled services start passively
        run: |
          npm run build:api
          npm run build:bot
          npm run verify:passive
        env:
          UNCS_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - name: Check storage test types and lint
        run: |
          npm run typecheck -- test/launch-storage.spec.ts
          npm run lint -- test/launch-storage.spec.ts

  admin-tests:
    name: Admin dashboard tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test staff access and server actions
        run: npm run test:admin
      - name: Test browser workflows with simulated responses
        run: npm run test:frontend
      - name: Check source formatting
        run: npm run format:check
      - name: Lint the browser dashboard
        run: npm run lint -- web/admin

  format:
    name: Format check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  validate-handlers:
    name: Validate command and event registrations
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate command and event handlers
        run: npm run validate:handlers

  migration-drift:
    name: Check migration drift for development to main
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated migrations are committed
        run: |
          DATABASE_URL="postgresql://placeholder" npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Migration drift detected. Generate and commit the migration on development before merging to main."
            git status --short -- drizzle
            exit 1
          fi
